name: frontend-ci-reusable

# workflow_call만 트리거로 둔다 — 이 워크플로우는 이 저장소에서 직접 push/PR로
# 도는 게 아니라, 다른 저장소(front-team)가 "불러줄 때만" 실행된다.
on:
  workflow_call:
    inputs:
      working-directory:
        description: "package.json이 있는 경로 (프론트 저장소 루트 기준)"
        required: false
        type: string
        default: "."

permissions:
  contents: read

# 같은 브랜치에 연달아 push하면 이전 실행은 취소한다 - 어차피 결과가 무의미하다
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks-secret-scan
        # dir이 아닌 git 모드 - 커밋 히스토리까지 스캔해야 지웠다 되살릴 수 있는 시크릿을 잡는다
        # (위 fetch-depth: 0이 전체 히스토리를 받아오는 이유)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose

      - name: trivy-fs-scan-block-critical-high
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: trivy-fs-generate-sarif
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend-fs-results.sarif
          exit-code: "0"

      - name: trivy-fs-upload-sarif
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-fs-results.sarif
          category: trivy-frontend-filesystem

  build:
    needs: security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: install-dependencies
        # lockfile 기준으로 정확히 고정된 버전만 설치
        run: npm ci

      - name: build
        run: npm run build

      # TODO: lint — 프론트 팀 ESLint 도입 여부 확정 후 스텝 추가
      # TODO: test — 프론트 팀 테스트 프레임워크 도입 여부 확정 후 스텝 추가
      # TODO: deploy/publish artifact — 배포 대상(정적 호스팅/K3s/CDN)과
      #       동일 오리진 여부(현재 "같은 도메인, 경로 분리" 전제로 답변 받음,
      #       최종 확정 시) 확정 후 스텝 추가
      # TODO: front-team 저장소에 이 워크플로우를 호출하는 caller workflow가
      #       아직 없음. front-team/.github/workflows/ci.yml 생성 필요.
      #       그 전까지는 이 워크플로우가 존재해도 실행되지 않는다(호출자 없음).