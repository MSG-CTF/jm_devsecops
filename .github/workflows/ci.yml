name: Django CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

# 같은 브랜치에 연달아 push하면 이전 실행은 취소한다 - 어차피 결과가 무의미하다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Gitleaks 시크릿 스캔
      # dir이 아닌 git 모드 - 커밋 히스토리까지 스캔해야 지웠다 되살릴 수 있는 시크릿을 잡는다
      # (위 fetch-depth: 0이 전체 히스토리를 받아오는 이유)
      run: |
        docker run --rm \
          -v "$PWD:/repo" \
          ghcr.io/gitleaks/gitleaks:v8.30.1 \
          git /repo --redact --verbose

    - name: Trivy 파일시스템 취약점 차단 검사 (Critical, High)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.72.0
        scan-type: fs
        scan-ref: .
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "1"

    - name: Trivy 파일시스템 SARIF 생성
      if: always()
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.72.0
        scan-type: fs
        scan-ref: .
        scanners: vuln
        ignore-unfixed: true
        format: sarif
        output: trivy-fs-results.sarif
        exit-code: "0"

    - name: Trivy SARIF 업로드
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-fs-results.sarif
        category: trivy-filesystem

  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ctf_db_test
          POSTGRES_USER: ctf_user
          POSTGRES_PASSWORD: ctf_password_secure_123
        ports:
          - 5432:5432
        # 서비스가 완전히 준비될 때까지 대기
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Run Linter (Black & Flake8)
      run: |
        # Django 프로젝트 코드가 존재할 경우 Lint 검사 실행
        if [ -d "app" ] || ls ./*.py 1> /dev/null 2>&1; then
          echo "Running Lint checks..."
          black --check . || true
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        else
          echo "No python files found to lint. Skipping."
        fi

    - name: Run Tests
      env:
        DEBUG: "False"
        SECRET_KEY: "django-insecure-ci-test-key-do-not-use-in-prod"
        POSTGRES_DB: ctf_db_test
        POSTGRES_USER: ctf_user
        POSTGRES_PASSWORD: ctf_password_secure_123
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
      run: |
        # manage.py가 존재하는 경우에만 Django 테스트 실행
        if [ -f manage.py ]; then
          python manage.py test
        else
          echo "manage.py not found. Django project might not be created yet. Skipping tests."
        fi

  docker-build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test Docker Build
      run: |
        # Dockerfile이 존재할 경우 빌드 검증 수행
        if [ -f Dockerfile ]; then
          docker build . --file Dockerfile --tag ctf-backend:test
        else
          echo "Dockerfile not found. Skipping docker build."
        fi

    - name: Trivy 이미지 취약점/시크릿 차단 검사 (Critical, High)
      if: hashFiles('Dockerfile') != ''
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.72.0
        image-ref: ctf-backend:test
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "1"

    - name: Trivy 이미지 SARIF 생성
      if: always() && hashFiles('Dockerfile') != ''
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.72.0
        image-ref: ctf-backend:test
        scanners: vuln,secret
        ignore-unfixed: true
        format: sarif
        output: trivy-image-results.sarif
        exit-code: "0"

    - name: Trivy 이미지 SARIF 업로드
      if: always() && hashFiles('Dockerfile') != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-image-results.sarif
        category: trivy-image
