name: Django CI Pipeline

on:
  push:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      enforce_black: true

  deployment-script-lint:
    name: deployment-script-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck scripts/deploy-development-vm.sh

      - name: 배포 스크립트 무결성 값 일치 확인
        run: |
          set -Eeuo pipefail
          actual_hash="$(sha256sum scripts/deploy-development-vm.sh | awk '{print $1}')"
          grep --fixed-strings --quiet \
            "'${actual_hash}'" \
            .github/workflows/reusable-vm-deploy-dev.yml
