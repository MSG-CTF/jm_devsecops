name: Django CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: actionlint and ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 중앙 저장소 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 고정 commit의 actionlint 설치
        env:
          ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_COMMIT}"

      - name: workflow YAML과 내장 shell 검사
        run: |
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Cloud Run 전환 응답 유실과 복구 검증
        run: |
          python3 -m venv "$RUNNER_TEMP/promotion-tests"
          "$RUNNER_TEMP/promotion-tests/bin/pip" install 'PyYAML==6.0.3'
          "$RUNNER_TEMP/promotion-tests/bin/python" -m unittest scripts/test_cloud_run_promotion.py -v

  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      enforce_black: true

  deployment-script-lint:
    name: deployment-script-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck scripts/deploy-development-vm.sh

      - name: Backend proxy cutover and rollback with isolated Docker containers
        env:
          MSG_BRIDGE_DOCKER_TESTS: '1'
        run: python3 -m unittest discover -s scripts -p 'test_backend_proxy_bridge.py' -v

      - name: 제한된 SSH 배포 명령 검증
        run: python3 -m unittest scripts/test_development_vm_ssh_gateway.py -v

      - name: 배포 스크립트 무결성 값 일치 확인
        run: |
          set -Eeuo pipefail
          actual_hash="$(sha256sum scripts/deploy-development-vm.sh | awk '{print $1}')"
          grep --fixed-strings --quiet \
            "'${actual_hash}'" \
            .github/workflows/reusable-vm-deploy-dev.yml
          bridge_hash="$(sha256sum scripts/backend_proxy_bridge.py | awk '{print $1}')"
          grep --fixed-strings --quiet "'${bridge_hash}'" \
            .github/workflows/reusable-vm-deploy-dev.yml
