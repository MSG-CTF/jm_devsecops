name: Reusable Django CI

on:
  workflow_call:
    inputs:
      python_version:
        description: 테스트에 사용할 Python 버전
        required: false
        default: "3.12.10"
        type: string
      health_path:
        description: 컨테이너 기동 후 확인할 HTTP 경로
        required: false
        default: /healthz
        type: string
      enforce_black:
        description: Black 포맷 오류로 CI를 실패시킬지 여부
        required: false
        default: false
        type: boolean

env:
  # msg-backend가 사용하는 이름과 기존 예제 프로젝트가 사용하는 이름을 함께 제공한다.
  DJANGO_SECRET_KEY: ci-only-django-key-0123456789abcdef-do-not-use-in-production
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: example.com
  JWT_SECRET: ci-only-jwt-key-0123456789abcdef-do-not-use-in-production
  SECRET_KEY: ci-only-django-key-0123456789abcdef-do-not-use-in-production
  DEBUG: "False"
  ALLOWED_HOSTS: example.com
  POSTGRES_DB: ctf_db_test
  POSTGRES_USER: ctf_user
  POSTGRES_PASSWORD: ctf_password_secure_123
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  DATABASE_HOST: localhost
  DATABASE_PORT: "5432"
  REDIS_URL: redis://localhost:6379/0

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Gitleaks 시크릿 스캔
      run: |
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/repo" \
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
          git /repo --redact --verbose

    - name: Trivy 파일시스템 취약점 차단 검사 (Critical, High)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.72.0
        scan-type: fs
        scan-ref: .
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "1"

    - name: Trivy 파일시스템 SARIF 생성 (수정본 없는 취약점 포함)
      if: always()
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.72.0
        scan-type: fs
        scan-ref: .
        scanners: vuln
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
        format: sarif
        output: trivy-fs-results.sarif
        exit-code: "0"

    - name: Trivy SARIF 업로드
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
      with:
        sarif_file: trivy-fs-results.sarif
        category: trivy-filesystem

  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: ctf_db_test
          POSTGRES_USER: ctf_user
          POSTGRES_PASSWORD: ctf_password_secure_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2@sha256:cbbf906f1c3abe4959f4c2bed45706eae7f89802a8a9fe105f252032f4eb864a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 필수 Django 파일 확인
      run: |
        test -f manage.py || { echo "manage.py가 없습니다."; exit 1; }
        test -f requirements.txt || { echo "requirements.txt가 없습니다."; exit 1; }

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}
        cache: pip

    - name: 의존성과 CI 검사 도구 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install black==25.1.0 flake8==7.2.0 redis==8.0.1

    - name: Black 포맷 보고서 (전환 기간에는 경고)
      if: ${{ !inputs.enforce_black }}
      continue-on-error: true
      run: black --check .

    - name: Black 포맷 병합 차단
      if: ${{ inputs.enforce_black }}
      run: black --check .

    - name: Flake8 치명적 오류 검사
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: PostgreSQL 실제 연결과 쿼리 확인
      run: >-
        python manage.py shell -c
        "from django.db import connection;
        cursor = connection.cursor();
        cursor.execute('SELECT 1');
        assert cursor.fetchone()[0] == 1;
        cursor.close()"

    - name: 누락된 migration 확인
      run: python manage.py makemigrations --check --dry-run

    - name: migration 실제 적용
      run: python manage.py migrate --noinput

    - name: Redis 저장과 조회 확인
      run: |
        python -c "import redis; client = redis.Redis.from_url('${REDIS_URL}'); client.set('ci:ping', 'pong', ex=60); assert client.get('ci:ping') == b'pong'; client.delete('ci:ping')"
        if grep -Eq '^django-redis([=<>~!]|$)' requirements.txt; then
          python manage.py shell -c "from django.core.cache import cache; cache.set('ci:django-cache', 'pong', 60); assert cache.get('ci:django-cache') == 'pong'; cache.delete('ci:django-cache')"
        fi

    - name: Django 테스트 실행 및 0개 테스트 방지
      shell: bash
      env:
        # 기존 API 테스트는 HTTP test client를 사용한다. HTTPS 강제 여부는 아래 deploy check에서 별도로 검사한다.
        DJANGO_DEBUG: "True"
        DEBUG: "True"
      run: |
        set -o pipefail
        python manage.py test --verbosity 2 2>&1 | tee "${RUNNER_TEMP}/django-tests.log"
        if ! grep -Eq 'Ran [1-9][0-9]* tests?' "${RUNNER_TEMP}/django-tests.log"; then
          echo "실행된 테스트가 0개이거나 테스트 수를 확인할 수 없습니다."
          exit 1
        fi

    - name: Django 배포 보안 점검
      env:
        DJANGO_DEBUG: "False"
        DEBUG: "False"
      run: python manage.py check --deploy --fail-level WARNING

  docker-build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Dockerfile 필수 확인
      run: test -f Dockerfile || { echo "루트 Dockerfile이 없습니다."; exit 1; }

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: 테스트 이미지 빌드
      run: docker build . --file Dockerfile --tag ctf-backend:test

    - name: 비루트 사용자와 Docker HEALTHCHECK 확인
      run: |
        container_user="$(docker image inspect ctf-backend:test --format '{{.Config.User}}')"
        if [ -z "$container_user" ] || [ "$container_user" = "0" ] || [ "$container_user" = "root" ]; then
          echo "컨테이너가 root 사용자로 실행되도록 설정되어 있습니다."
          exit 1
        fi
        healthcheck="$(docker image inspect ctf-backend:test --format '{{json .Config.Healthcheck.Test}}')"
        if [ "$healthcheck" = "null" ] || [ -z "$healthcheck" ]; then
          echo "Dockerfile에 HEALTHCHECK가 없습니다."
          exit 1
        fi

    - name: 운영과 같은 Host로 컨테이너 기동 확인
      env:
        HEALTH_PATH: ${{ inputs.health_path }}
      run: |
        docker run --detach --name ctf-backend-ci \
          --publish 127.0.0.1:18080:8080 \
          --env PORT=8080 \
          --env DJANGO_SECRET_KEY=ci-only-django-key-0123456789abcdef \
          --env DJANGO_DEBUG=False \
          --env DJANGO_ALLOWED_HOSTS=example.com \
          --env HEALTHCHECK_HOST=example.com \
          --env JWT_SECRET=ci-only-jwt-key-0123456789abcdef \
          --env SECRET_KEY=ci-only-django-key-0123456789abcdef \
          --env DEBUG=False \
          --env ALLOWED_HOSTS=example.com \
          ctf-backend:test

        for _attempt in {1..20}; do
          if curl --fail --silent --show-error \
            --header 'Host: example.com' \
            --header 'X-Forwarded-Proto: https' \
            "http://127.0.0.1:18080${HEALTH_PATH}"; then
            exit 0
          fi
          sleep 2
        done

        docker logs ctf-backend-ci
        exit 1

    - name: 테스트 컨테이너 정리
      if: always()
      run: docker rm --force ctf-backend-ci 2>/dev/null || true

    - name: Trivy 이미지 취약점/시크릿 차단 검사 (Critical, High)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.72.0
        image-ref: ctf-backend:test
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "1"

    - name: Trivy 이미지 SARIF 생성 (수정본 없는 취약점 포함)
      if: always()
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.72.0
        image-ref: ctf-backend:test
        scanners: vuln,secret
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
        format: sarif
        output: trivy-image-results.sarif
        exit-code: "0"

    - name: Trivy 이미지 SARIF 업로드
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
      with:
        sarif_file: trivy-image-results.sarif
        category: trivy-image
