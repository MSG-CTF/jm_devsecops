name: Django CD Pipeline

# main에서 CI가 성공한 커밋만 공통 CD 워크플로에 전달한다.
on:
  workflow_run:
    workflows: ["Django CI Pipeline"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: read
  security-events: write
  id-token: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/reusable-cd.yml
    with:
      commit_sha: ${{ github.event.workflow_run.head_sha }}
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      image_name: ctf-backend
      cloud_run_service: ctf-backend
      region: asia-northeast3
    secrets: inherit
