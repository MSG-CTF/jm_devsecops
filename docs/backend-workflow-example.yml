# 이 파일을 백엔드 저장소의 .github/workflows/ci-cd.yml로 복사한다.
# 1단계에서는 CI만 사용한다. Cloud SQL·Redis·Secret Manager 준비가 끝난 뒤 deploy job을 추가한다.
name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # 공개 뒤에는 움직이는 main 대신 검증이 끝난 고정 버전을 사용한다.
    uses: MSG-CTF/jm_devsecops/.github/workflows/reusable-ci.yml@v3.3.0
    with:
      # 별도 /healthz 없이 백엔드에 이미 있는 Django 관리자 로그인 화면을 한 번 확인한다.
      smoke_test_path: /admin/login/

# 2단계 CD 예제는 docs/devsecops-runbook.md의 "CD를 나중에 켜는 방법"을 따른다.
