# 이 파일을 백엔드 저장소의 .github/workflows/ci-cd.yml로 복사한다.
# 1단계에서는 CI만 사용한다. Cloud SQL·Redis·Secret Manager 준비가 끝난 뒤 deploy job을 추가한다.
name: Backend CI

on:
  push:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # v2.0.0 태그는 중앙 저장소 검증과 release가 끝난 뒤 사용한다.
    uses: MSG-CTF/jm_devsecops/.github/workflows/reusable-ci.yml@v2.0.0

# 2단계 CD 예제는 docs/devsecops-runbook.md의 "CD를 나중에 켜는 방법"을 따른다.
